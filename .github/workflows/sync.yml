name: Sync Notion schedule to calendar feeds

on:
  schedule:
    # Runs every 5 minutes. GitHub Actions free tier gives 2,000 minutes/month
    # on private repos and unlimited minutes on public repos - this uses only
    # a fraction of a minute per run, so it stays free indefinitely.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run/test from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: carlam-schedule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar feeds
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FILENAME_SALT: ${{ secrets.FILENAME_SALT }}
        run: python generate_ics.py

      - name: Generate schedule grid
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FILENAME_SALT: ${{ secrets.FILENAME_SALT }}
        run: python generate_grid.py

      - name: Generate schedule webpage
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FILENAME_SALT: ${{ secrets.FILENAME_SALT }}
        run: python generate_webpage.py

      - name: Commit updated feeds
        run: |
          git config user.name "carlam-schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Update calendar feeds"
          git pull --rebase --autostash origin main
          git push
