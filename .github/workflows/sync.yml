name: Sync Notion schedule to calendar feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar feeds
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python generate_ics.py

      - name: Commit updated feeds
        run: |
          git config user.name "carlam-schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Update calendar feeds"
          git push
