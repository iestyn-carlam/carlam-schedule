<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="120">
<title>Carlam Team Schedule - Technical</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #fafafa;
    color: #1a1a1a;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }
  .meta {
    font-size: 13px;
    color: #666;
    margin-bottom: 16px;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid #ddd;
    border-radius: 6px;
  }
  table {
    border-collapse: collapse;
    min-width: 100%;
  }
  th, td {
    border: 1px solid #e0e0e0;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
    white-space: nowrap;
  }
  td {
    white-space: normal;
    min-width: 140px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #333;
    color: #fff;
    z-index: 2;
  }
  .daterow {
    position: sticky;
    left: 0;
    background: #f0f0f0;
    z-index: 1;
    font-weight: 600;
  }
  thead th.daterow {
    background: #333;
    color: #fff;
    z-index: 3;
  }
  tr.weekend .daterow {
    background: #d6d6d6;
    border-left: 4px solid #999;
  }
  tr.weekend td {
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
  }
  tr.today .daterow {
    background: #3f7fd1;
    color: #fff;
    border-left: 4px solid #26518f;
  }
  tr.today td {
    background: rgba(63, 127, 209, 0.10);
    border-top: 1px solid #3f7fd1;
    border-bottom: 1px solid #3f7fd1;
  }
  .past-toggle-row td {
    padding: 0;
    border: none;
  }
  .past-toggle-wrap {
    padding: 6px 0 12px 0;
  }
  .past-toggle {
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    color: #333;
  }
  .past-toggle:hover {
    background: #f0f0f0;
  }
  tbody.past-weeks {
    display: none;
  }
  tbody.past-weeks.expanded {
    display: table-row-group;
  }
  .entry {
    margin-bottom: 4px;
  }
  .entry:last-child {
    margin-bottom: 0;
  }
  .notes {
    font-size: 11px;
    color: #555;
    font-style: italic;
  }
  a.back {
    display: inline-block;
    margin-bottom: 12px;
    font-size: 13px;
    color: #333;
    text-decoration: none;
  }
  a.back:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; All schedules</a>
  <h1>Carlam Team Schedule - Technical</h1>
  <div class="meta">Last updated 26 Aug 2026, 14:17 UTC &middot; refreshes automatically every 2 minutes &middot; keep this tab open for a live view</div>
  <p style="color:#666;font-size:14px;">No entries tagged for this team yet.</p>
</body>
</html>
